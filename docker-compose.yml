services:
  mtg:
    image: nineseconds/mtg:2.2
    container_name: tg-mtproto-proxy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config/mtg.toml:/config.toml:ro
    ports:
      - "${MTPROTO_PUBLISH_HOST:-0.0.0.0}:${MTPROTO_HOST_PORT}:${MTPROTO_BIND_PORT}"

  socks5:
    profiles: ["bot"]
    image: serjs/go-socks5-proxy:latest
    container_name: tg-bot-socks5
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROXY_USER: ${SOCKS5_USER}
      PROXY_PASSWORD: ${SOCKS5_PASSWORD}
    ports:
      - "${SOCKS5_PUBLISH_HOST:-0.0.0.0}:${SOCKS5_HOST_PORT:-1080}:1080"
